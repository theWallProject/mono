<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oceansix is now RePack</title>
    <style>
        /* Basic CSS Reset */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Centering Container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            background-color: #f0f2f5; /* A light, neutral background */
        }

        /* Message Box */
        .message-box {
            text-align: center;
            padding: 40px 60px;
            background-color: #ffcc00;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        /* Main Heading */
        h1 {
            font-size: 2.5em; /* em is a scalable unit */
            color: #1c1e21; /* A dark, professional color */
            margin: 0;
        }

        /* Optional Sub-heading */
        p {
            font-size: 1.2em;
            color: #606770;
            margin-top: 10px;
        }

        /* Media query for smaller screens */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            p {
                font-size: 1em;
            }
            .message-box {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="message-box">
            <h1>oceansix is now RePack</h1>
            <p><a alt="" href="https://www.repack.com">https://www.repack.com</a></p>
        </div>
    </div>



</body></html>
