; }  } }/* ====== Move-from-top effect ======*/.mfp-move-from-top{  .mfp-content{ vertical-align:top; }  /* start state */ .mfp-with-anim{ opacity:0; transition:all 0.2s;  transform:translateY(-100px); }  &.mfp-bg{ opacity:0; transition:all 0.2s; }  /* animate in */ &.mfp-ready{ .mfp-with-anim{ opacity:1; transform:translateY(0); } &.mfp-bg{ opacity:0.8; } }  /* animate out */ &.mfp-removing{  .mfp-with-anim{ transform:translateY(-50px); opacity:0; } &.mfp-bg{ opacity:0; }  } }/* ====== 3d unfold ======*/.mfp-3d-unfold{   .mfp-content{ perspective:2000px; }  /* start state */ .mfp-with-anim{ opacity:0; transition:all 0.3s ease-in-out; transform-style:preserve-3d; transform:rotateY(-60deg); }   &.mfp-bg{ opacity:0; transition:all 0.5s; }  /* animate in */ &.mfp-ready{ .mfp-with-anim{ opacity:1; transform:rotateY(0deg); } &.mfp-bg{ opacity:0.8; } }  /* animate out */ &.mfp-removing{  .mfp-with-anim{ transform:rotateY(60deg); opacity:0; } &.mfp-bg{ opacity:0; }  } }/* ====== Zoom-out effect ======*/.mfp-zoom-out{  /* start state */ .mfp-with-anim{ opacity:0; transition:all 0.3s ease-in-out; transform:scale(1.3); }  &.mfp-bg{ opacity:0; transition:all 0.3s ease-out; }  /* animate in */ &.mfp-ready{ .mfp-with-anim{ opacity:1; transform:scale(1); } &.mfp-bg{ opacity:0.8; } }  /* animate out */ &.mfp-removing{  .mfp-with-anim{ transform:scale(1.3); opacity:0; } &.mfp-bg{ opacity:0; }  } }/* ====== "Hinge" close effect ======*/@keyframes hinge{0%{transform:rotate(0);transform-origin:top left;animation-timing-function:ease-in-out;}20%, 60%{transform:rotate(80deg);transform-origin:top left;animation-timing-function:ease-in-out;}40%{transform:rotate(60deg);transform-origin:top left;animation-timing-function:ease-in-out;}80%{transform:rotate(60deg) translateY(0);opacity:1;transform-origin:top left;animation-timing-function:ease-in-out;}100%{transform:translateY(700px);opacity:0;}}.hinge{ animation-duration:1s;animation-name:hinge;}.mfp-with-fade{ // before-open state .mfp-content, &.mfp-bg{ opacity:0; transition:opacity .5s ease-out; } // open state &.mfp-ready{ .mfp-content{ opacity:1; } &.mfp-bg{ opacity:0.8;// background opacity } }  // closed state &.mfp-removing{ &.mfp-bg{ opacity:0; } }}/* preview styles */html{ font-family:"Calibri", "Trebuchet MS", "Helvetica", sans-serif;}h3{ margin-top:0; font-size:24px;}a, a:visited{ color:#1760BF; text-decoration:none; } a:hover{ color:#c00; }.links{ ul{  } li{ margin-bottom:5px; }}h4{ margin:24px 0 0 0;}.bottom-text{ margin-top:40px; border-top:2px solid #CCC; a{ border-bottom:1px solid #CCC; } p{ max-width:650px; }}/********* End Magnific Gallery ***********/</style>

<script>
	var dropDownLink = document.querySelectorAll(".btn-dropdown-menu-True");
	var dropDownMenu = document.querySelectorAll(".dropdown-menu-True");
	var dropDown = document.querySelectorAll(".dropdown-True");
	var event = ('ontouchstart' in document.documentElement) ? 'touchend' : 'click';

	for (var i = 0; i < dropDown.length; i++) {
		dropDownLink[i].dataset.link = i;
		dropDownLink[i].dataset.active = "false";
		dropDownMenu[i].dataset.open = "false";

		console.log(dropDownLink[i].dataset.active);
		dropDownLink[i].addEventListener(event, function(e) {
			if(dropDownMenu[this.dataset.link].dataset.open === "false") {
				dropDownMenu[this.dataset.link].dataset.open = "true";
				dropDownMenu[this.dataset.link].classList.add("menu-flyin");
				dropDownLink[this.dataset.link].dataset.active = "true";
			} else if(dropDownMenu[this.dataset.link].dataset.open === "true") {
				dropDownMenu[this.dataset.link].dataset.open = "false";
				dropDownMenu[this.dataset.link].classList.remove("menu-flyin");
				dropDownLink[this.dataset.link].dataset.active = "false";
			}
		}, false);

	}
</script>
<script>

		bodyElement.classList.toggle("menu-open");

	var x = document.getElementsByClassName("menu-overlay");
	x[0].onclick = function() {menuClose()};

			var bodyElement = document.getElementById("mpBody")
			bodyElement.classList.toggle("menu-open");

			return false;
		}
	}

	$(document).ready(function() {
		SetAffix();
	});
	
	function SetAffix() {
		$('#siteHeader').affix({
			offset: {
				top: function () {
					var headerTopHeight = $('#siteHeader').outerHeight();
					return this.top = headerTopHeight;		
				}
			}
		});
	}
	
	document.addEventListener("DOMContentLoaded", function() {
		GetCartItemCount();
	});

	function GetCartItemCount()
	{
		xhr = new XMLHttpRequest();
		xhr.open('POST', '/shop/api/v1/cart/items/count');
		xhr.setRequestHeader('Content-Type', 'application/json');
		xhr.onload = function() {
			var response = JSON.parse(xhr.responseText);
			if (xhr.status === 200) {			
				if(response.status.ok)
				{
					$(".navbar-header-cart .badge").text(response.data);
					//$(".navbar-cart-2 .badge-2").text(response.data);
				}
				else
				{
					$(".navbar-header-cart .badge").text(0);	
					//$(".navbar-cart-2 .badge-2").text(0);	
				}

			}
			else if (xhr.status !== 200) {
				console.log(xhr);
				$(".navbar-header-cart .badge").text(0);
				//$(".navbar-cart-2 .badge-2").text(0);
			}
		};
		xhr.send(JSON.stringify({ "cdtid": 2 }));
	}
	
</script>
