<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>appTV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }
        
        .content {
            flex: 1;
            max-width: 500px;
            text-align: left;
        }
        
        .coming-soon {
            font-size: 3rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .content h1 {
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.95;
        }
        
        .image-container {
            flex: 1;
            max-width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .marketing-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            object-fit: contain;
        }
        
        .footer {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            opacity: 0.8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            text-align: center;
        }
        
        .heart {
            color: #EF4444;
            font-size: 1rem;
            display: inline-block;
        }
        
        @media (max-width: 1024px) {
            .container {
                gap: 50px;
            }
            
            .content h1 {
                font-size: 1.05rem;
            }
            
            .coming-soon {
                font-size: 2.5rem;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 40px;
                text-align: center;
                padding: 0 15px;
            }
            
            .content {
                text-align: center;
                max-width: 100%;
            }
            
            .content h1 {
                font-size: 1rem;
                line-height: 1.5;
            }
            
            .coming-soon {
                font-size: 2rem;
            }
            
            .marketing-image {
                max-width: 280px;
            }
            
            .footer {
                position: relative;
                bottom: auto;
                left: auto;
                transform: none;
                margin-top: 40px;
                padding: 0 20px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 0 10px;
            }
            
            .content h1 {
                font-size: 0.9rem;
                line-height: 1.4;
            }
            
            .coming-soon {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }
            
            .marketing-image {
                max-width: 230px;
            }
            
            .footer {
                font-size: 0.8rem;
                padding: 0 15px;
            }
        }
        
        @media (max-width: 320px) {
            .content h1 {
                font-size: 0.85rem;
            }
            
            .coming-soon {
                font-size: 1.5rem;
            }
            
            .marketing-image {
                max-width: 200px;
            }
            
            .footer {
                font-size: 0.75rem;
            }
        }
              .heart {
            color: #EF4444;
            display: inline-block;
        }
        
        .heart::before {
            content: "\2764\FE0F";
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Android Emoji", sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="coming-soon">Coming Soon</div>
            <h1>Thanks for visiting appTV<br>
            We're dedicated to craft simple to use, powerful, innovative tools designed to significantly improve your marketing strategies and implementation to the next level</h1>
        </div>
        
        <div class="image-container">
            <img src="./img/Marketing2-768x768.webp" alt="Marketing illustration" class="marketing-image">
        </div>
    </div>
    
    <div class="footer">
                  <p>Made with <span class="heart"></span> By appTV Ltd.</p>
    </div>
</body></html>
