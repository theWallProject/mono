g22_070d6b-11"></p></div></div></div><div class="gb-grid-column gb-grid-column-c721ddeb"><div class="gb-container gb-container-c721ddeb"><div class="gb-inside-container"></div></div></div><div class="gb-grid-column gb-grid-column-2c656555"><div class="gb-container gb-container-2c656555"><div class="gb-inside-container"><h3 class="kt-adv-heading22_ce2d14-56 wp-block-kadence-advancedheading has-theme-palette-2-color has-text-color" data-kb-block="kb-adv-heading22_ce2d14-56">מי אנחנו</h3><h2 class="kt-adv-heading22_0b9784-1e wp-block-kadence-advancedheading" data-kb-block="kb-adv-heading22_0b9784-1e">חד אסף מתכות בע"מ</h2><p>הינה חברה ציבורית וותיקה המובילה בארץ לייצור ועיבוד ברזל לבניין, ייצור ועיבוד רשתות לזיון בטון וייצור מוצרי מתכת מחוטים מתוחים ומגולוונים.</p><p>לחברה שני אתרי ייצור עיקריים האחד בעכו ובו פועלים מפעלי המחזור ההתכה, ועיבוד ברזל לבניין, ייצור רשתות, כלונסאות ואלמנטים מורכבים.</p><p>המפעל השני בקריית גת, ובו פועל מפעל הערגול– המבצע הפיכת מטילי פלדה לברזל בנין במוטות ובגלילים, ומפעל לעיבוד ברזל לבניין, ייצור רשתות, כלונסאות ואלמנטים מורכבים.</p><div class="gb-grid-wrapper gb-grid-wrapper-f15a8458"><div class="gb-grid-column gb-grid-column-54507a4e"><div class="gb-container gb-container-54507a4e"><div class="gb-inside-container"><div id="kt-info-box_4f58b7-fc" class="four-block wp-block-kadence-infobox"><div class="kt-blocks-info-box-link-wrap info-box-link kt-blocks-info-box-media-align-top kt-info-halign-center"><div class="kt-blocks-info-box-media-container"><div class="kt-blocks-info-box-media kt-info-media-animate-none"><div class="kadence-info-box-image-inner-intrisic-container"><div class="kadence-info-box-image-intrisic kt-info-animate-none"><div class="kadence-info-box-image-inner-intrisic"><img fetchpriority="high" decoding="async" src="https://www.hodmetal.co.il/wp-content/uploads/2023/01/recycle-sign.png" alt="Recycle sign" width="512" height="512" class="kt-info-box-image wp-image-27159" srcset="https://www.hodmetal.co.il/wp-content/uploads  משרד הביטחון.</li></ul></div></div></div></div></div></div></div></div><div class="kb-row-layout-wrap kb-row-layout-id22_310295-14 alignnone kb-v-lg-hidden kb-v-md-hidden kb-v-sm-hidden wp-block-kadence-rowlayout"><div class="kt-row-column-wrap kt-has-1-columns kt-row-layout-equal kt-tab-layout-inherit kt-mobile-layout-row kt-row-valign-top"><div class="wp-block-kadence-column kadence-column22_3319f6-a1 inner-column-1"><div class="kt-inside-inner-col"><div class="gb-grid-wrapper gb-grid-wrapper-7f3de5c9"><div class="gb-grid-column gb-grid-column-6478e01e"><div class="gb-container gb-container-6478e01e"><div class="gb-inside-container"><h3 class="kt-adv-heading22_a1bebf-3b wp-block-kadence-advancedheading has-theme-palette-2-color has-text-color" data-kb-block="kb-adv-heading22_a1bebf-3b">למה לבחור חד אסף?</h3><h2 class="kt-adv-heading22_0124e5-2a wp-block-kadence-advancedheading" data-kb-block="kb-adv-heading22_0124e5-2a"><meta charset="utf-8">היתרונות שלנו</h2><div class="wp-block-kadence-infobox kt-info-box22_53747b-f4"><span class="kt-blocks-info-box-link-wrap info-box-link kt-blocks-info-box-media-align-left kt-info-halign-right kb-info-box-vertical-media-align-top"><div class="kt-blocks-info-box-media-container"><div class="kt-blocks-info-box-media kt-info-media-animate-none"><div class="kadence-info-box-icon-container kt-info-icon-animate-none"><div class="kadence-info-box-icon-inner-container"><span class="kb-svg-icon-wrap kb-svg-icon-fe_check kt-info-svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div></div></div></div><div class="kt-infobox-textcontent"><h3 class="kt-blocks-info-box-title">ניסיון וותק</h3><p class="kt-blocks-info-box-text">החברה הוקמה בשנת 1947 ונסחרת בבורסה בת"א מאז 1992, מאחורינו עשרות שנים של ניסיון. מוצרי החברה מצויים בשימוש בתחומי הבנייה, תעשיה, תשתיות, ביטחון ועוד, בחברות המובילות בישראל.</p></div></span></div><div class="wp-block-kadence-infobox kt-info-box22_a66cfa-3a"><span class="kt-blocks-info-box-link-wrap info-box-link kt-blocks-info-box-media-align-left kt-info-halign-right kb-info-box-vertical-media-align-top"><div class="kt-blocks-info-box-media-container"><div class="kt-blocks-info-box-media kt-info-media-animate-none"><div class="kadence-info-box-icon-container kt-info-icon-animate-none"><div class="kadence-info-box-icon-inner-container"><span class="kb-svg-icon-wrap kb-svg-icon-fe_check kt-info-svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div></div></div></div><div class="kt-infobox-textcontent"><h3 class="kt-blocks-info-box-title">איכות ברמה גבוהה</h3><p class="kt-blocks-info-box-text"><strong><meta charset="utf-8"></strong>החברה מחויבת לספק מוצרים ברמת גימור גבוהה ולפי התקנים המחמירים ביותר.</p></div></span></div><div class="wp-block-kadence-infobox kt-info-box22_e760ac-6c"><span class="kt-blocks-info-box-link-wrap info-box-link kt-blocks-info-box-media-align-left kt-info-halign-right kb-info-box-vertical-media-align-top"><div class="kt-blocks-info-box-media-container"><div class="kt-blocks-info-box-media kt-info-media-animate-none"><div class="kadence-info-box-icon-container kt-info-icon-animate-none"><div class="kadence-info-box-icon-inner-container"><span class="kb-svg-icon-wrap kb-svg-icon-fe_check kt-info-svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div></div></div></div><div class="kt-infobox-textcontent"><h3 class="kt-blocks-info-box-title">סל מוצרים רחב</h3><p class="kt-blocks-info-box-text"><strong><meta charset="utf-8"></strong>החברה הינה אחת החברות הוותיקות והמובילות בישראל לייצור מוטות, גלילי ברזל לבניין. כ"כ מתמחה בעיבוד ברזל לבניין, רשתות מרותכות לזיון בטון, ייצור מוצרים מתועשים מיוחדים, גידור, חוטים וחומרי בניין.</p></div></span></div><div class="wp-block-kadence-infobox kt-info-box22_654e8a-e8"><span class="kt-blocks-info-box-link-wrap info-box-link kt-blocks-info-box-media-align-left kt-info-halign-right kb-info-box-vertical-media-align-top"><div class="kt-blocks-info-box-media-container"><div class="kt-blocks-info-box-media kt-info-media-animate-none"><div class="kadence-info-box-icon-container kt-info-icon-animate-none"><div class="kadence-info-box-icon-inner-container"><span class="kb-svg-icon-wrap kb-svg-icon-fe_check kt-info-svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div></div></div></div><div class="kt-infobox-textcontent"><h3 class="kt-blocks-info-box-title">פתרונות מיוחדים מתקדמים</h3><p class="kt-blocks-info-box-text"><strong><meta charset="utf-8"></strong>החברה עמלה רבות לפיתוח וקידום מוצרים מתועשים חכמים.</p></div></span></div><div class="wp-block-kadence-infobox kt-info-box22_f6b9a9-ac"><span class="kt-blocks-info-box-link-wrap info-box-link kt-blocks-info-box-media-align-left kt-info-halign-right kb-info-box-vertical-media-align-top"><div class="kt-blocks-info-box-media-container"><div class="kt-blocks-info-box-media kt-info-media-animate-none"><div class="kadence-info-box-icon-container kt-info-icon-animate-none"><div class="kadence-info-box-icon-inner-container"><span class="kb-svg-icon-wrap kb-svg-icon-fe_check kt-info-svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polyline poin
