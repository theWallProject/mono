<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funzy Games</title>
    <link rel="stylesheet" href="https://funzy.games/static/css/style.css">
</head>
<body>
    <div id="application">
        
<div class="game-single-page">
    <!-- Header -->
    <header class="header">
        <div class="container header__container">
            <div class="header__logo">
                <a href="/" class="active">
                    <img src="/static/images/funzy-logo.png" width="100" class="header__logo-img" alt="funzy">
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="page-section game-single-page__hero">
        <div class="container">
            <div class="hero-container">
                <div class="hero-video">
                    <video class="hero-video__content" loop="" playsinline="" autoplay="" muted="">
                        <source src="/static/header-video.mp4" type="video/mp4">
                    </video>
                    <div class="hero-video__overlay"></div>
                    <div class="hero-logo">
                        <img src="/static/images/charmed_mansion.png" alt="Charmed Mansion">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Game Title Section -->
    <section class="page-section game-single-page__header">
        <div class="container">
            <div class="header-block">
                <h2 class="header-block__header h2--middle">Charmed Mansion</h2>
                <p class="header-block__subheader subheader">
                    Discover the magical world of Charmed Mansion - a captivating bubble shooter game!
                </p>
            </div>
        </div>
    </section>

    <!-- App Store Links -->
    <section class="page-section game-single-page__store">
        <div class="container container--text">
            <div class="application-stores">
                <a class="application-stores__item" href="https://apps.apple.com/il/app/charmed-mansion-bubble-pop/id6471078046" target="_blank" rel="noopener noreferrer">
                    <img src="/static/images/app-store.png" alt="Download on App Store">
                </a>
                <a class="application-stores__item" href="https://play.google.com/store/apps/details?id=funzy.charmed.mansion.bubble.shooter" target="_blank" rel="noopener noreferrer">
                    <img src="/static/images/google-play.png" alt="Get it on Google Play">
                </a>
            </div>
        </div>
    </section>

    <!-- Screenshot Gallery -->
    <section class="page-section game-single-page__screens">
        <div class="container">
            <div class="screen-gallery">
                
                <div class="screen-gallery__item">
                    <img class="screen-gallery__img" src="/static/images/screenshots/1.png" alt="Screenshot 1">
                </div>
                
                <div class="screen-gallery__item">
                    <img class="screen-gallery__img" src="/static/images/screenshots/2.png" alt="Screenshot 2">
                </div>
                
                <div class="screen-gallery__item">
                    <img class="screen-gallery__img" src="/static/images/screenshots/3.png" alt="Screenshot 3">
                </div>
                
                <div class="screen-gallery__item">
                    <img class="screen-gallery__img" src="/static/images/screenshots/4.png" alt="Screenshot 4">
                </div>
                
                <div class="screen-gallery__item">
                    <img class="screen-gallery__img" src="/static/images/screenshots/5.png" alt="Screenshot 5">
                </div>
                
            </div>
        </div>
    </section>


    <!-- Footer -->
    <footer class="footer">
        <div class="container footer__container">
            <div class="footer__wrapper">
                <div class="footer__link-gallery">
                    <a class="footer__link" href="/privacy">Privacy policy</a>
                    <a class="footer__link" href="/terms">Terms of use</a>
                    <a class="footer__link" href="/support">Support</a>
                </div>
                <div class="footer__copyright">
                    <span>© 2024 Funzy Games</span>
                </div>
            </div>
        </div>
    </footer>
</div>

    </div>

 </body></html>
