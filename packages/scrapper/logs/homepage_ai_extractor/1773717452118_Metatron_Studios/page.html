<script>
  var myzoom=100;
  var zoomstep=5;
  var zoomMax=150;
  var zoomMin=100;
  var readableFont='arial';
  var initFont = $('body').css("font-family");
  function toggleAccMenu(){
    if($('.accPanel').css("display")=="none"){
      $('.accPanel').css('display','flex');
    }else{
      $('.accPanel').hide();
    }
  }
  function accClose(){
    $('.accPanel').hide();
  }
  function m_bw(){
    $('body').removeClass('f_bw f_inv f_con').addClass('f_bw');
  }
  function m_inv(){
    $('body').removeClass('f_bw f_inv f_con').addClass('f_inv');
  }
  function m_con(){
    $('body').removeClass('f_bw f_inv f_con').addClass('f_con');
  }
  function m_bigger(){
    myzoom = Math.min(myzoom+zoomstep , zoomMax);
    document.body.style.zoom = myzoom+"%";
  }
  function m_smaller(){
    myzoom = Math.max(myzoom-zoomstep , zoomMin);
    document.body.style.zoom = myzoom+"%";
  }
  function m_font(){
    $('body').css("font-family",readableFont);
  }
  function m_reset(){
    myzoom=100;
    document.body.style.zoom = myzoom+"%";
    $('body').removeClass('f_bw f_inv f_con');
    $('body').css("font-family",initFont);
  }

  var k_c=false
  function handleKeyDown(e) {
    if(e.keyCode==17)k_c=true;
    if(e.keyCode==73 && k_c){
      toggleAccMenu();
    }
 
    if(e.keyCode == 27){
      accClose();
    }
  }
  function handleKeyUp(e) {
      if(e.keyCode==17)k_c=false;
  }

  window.onkeydown = handleKeyDown;
  window.onkeyup = handleKeyUp;

  function initfocus(){
    $('.accMenu').focus();
  }
  $(function() {
    initfocus();

    $(window).click(function() {   
      if($('.accPanel').css("display")!="none"){
        accClose(); 
      }
    });

  });
</script>
