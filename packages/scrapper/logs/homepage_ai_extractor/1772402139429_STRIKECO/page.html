  }

    font-weight: var(--typeBaseWeight);
    letter-spacing: var(--typeBaseSpacing);

  }

    }

    }
    100% {

    }

    position: fixed;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    align-items: center;
    justify-content: center;
    z-index: 10001;
    background-color: #000000;

  }

    .splash-screen__loader {
      max-width: 400px;
    }
  }

  .splash-screen img {
    display: block;
    max-width: 100%;

    height: auto;

  }

  .loader-text {

    top: 0;
    right: 0;

    display: block;
  }

  .transition-body {
    opacity: 0;
  }

  .btn--loading span:after {
    content: "Loading";
  }
