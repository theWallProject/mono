<meta name="description" content="Triple E Technologies has over 35 years experience in the petroleum marketing industry and develops Convenience Store POS software and hardware products designed to meet the needs of any type of fueling location a petroleum marketer owns or operates.

We realized petroleum marketers needed a flexible turnkey POS solution that accepted proprietary credit cards, common credit cards, and fuel network cards.

Since many service stations, bulk plants and cardlock sites are paired with convenience stores, we also realized our products had to include a common interface for both entities. The Triple E answer to this unique challenge is a modular suite of software and hardware products that work as an integrated product, as stand-alone solutions, or as a customized configuration that can meet any POS business need.">
<meta name="keywords" content="POS, Register, Fuel systems, dispenser, proprietary card, cardlock, unattended station, payment application, custom software">
