<!DOCTYPE html><html lang="he" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צור קשר - Groo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <div class="container">
            <header>
                <div class="logo-container">
                    <img src="groo.png" alt="Groo" class="logo">
                </div>
            </header>
            
            <div class="info-message">
                <p><strong>חשוב לדעת:</strong> אף שאתר Groo סיים את פעילותו העסקית, אנו עדיין מחויבים ללקוחותינו. צוות התמיכה שלנו זמין לענות על שאלות, לספק עזרה ולטפל בכל בקשה הנוגעת למוצרים ושירותים שנרכשו בעבר. תודה!</p>
            </div>
            
            <main>
                <div class="form-container">
                    <h1 class="form-title">צור קשר</h1>
                    <p class="form-subtitle">נשמח לעמוד לשירותכם</p>
                    
                    <form id="contactForm" class="contact-form">
                        <div class="form-group">
                            <label for="fullName">שם מלא</label>
                            <input type="text" id="fullName" name="fullName" required="" placeholder="הכנס/י את שמך המלא">
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">טלפון</label>
                            <input type="tel" id="phone" name="phone" required="" placeholder="הכנס/י מספר טלפון">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">דוא"ל</label>
                            <input type="email" id="email" name="email" required="" placeholder="your@email.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="reason">סיבת הפנייה</label>
                            <textarea id="reason" name="reason" rows="4" required="" placeholder="כיצד נוכל לעזור?"></textarea>
                        </div>
                        
                        <button type="submit" class="submit-btn">
                            <span class="btn-text">שליחת הטופס</span>
                        </button>
                    </form>
                    
                    <!-- זמן התגובה הוסר לפי בקשת המשתמש -->
                </div>
            </main>
        </div>
    </div>
    <script src="script.js"></script>


</body></html>
