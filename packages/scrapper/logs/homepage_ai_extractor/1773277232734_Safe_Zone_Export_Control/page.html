									</div>

								    <div class="invalid-feedback">
								    	Password is required
							    	</div>
								</div>

								<div class="d-flex align-items-center">
								
									<div class="form-check">
										<input type="checkbox" name="remember" id="remember" class="form-check-input" checked="">
										<label for="remember" class="form-check-label">Remember Me</label>
									</div>
									 <input type="hidden" name="token" value="810fcd05aa8d079c39d8bbdd3ed41fe7">
									<button type="submit" class="btn btn-primary ms-auto" onclick="$('.preloader').show();">
										Login
									</button>

																<div class="mt-3">
								<a href="reset_pass.html" class="float-middle">
											Forgot Password?
										</a>
										</div>
								
										<div class="mt-5 text-center">

       toastList.forEach(toast => toast.show()); // This show them
