</a></div><div class="collection-content"><div class="collection-inner"><h2 class="section-title ">הסיפור של                                          <img data-lazyloaded="1" src="data:image/gif;base64,R0lGODdhAQABAPAAAMPDwwAAACwAAAAAAQABAAACAkQBADs=" data-src="https://www.marinado.co.il/wp-content/uploads/2024/01/marinado-logo.svg" alt=""><noscript><img src="https://www.marinado.co.il/wp-content/uploads/2024/01/marinado-logo.svg" alt=""/></noscript></h2><div class="text"><p>מי אנחנו? <br>
מרינדו היא חברה בבעלות משפחתית, שמשווקת בשר ללקוחות פרטיים, ללא מתווכים, מהמגדל ישירות ללקוח. מרינדו מייצרת בשר ברמה הגבוהה ביותר, שהוא תוצרת ישראלית, Farm to table, תוך הקפדה על תנאי גידול אידאליים וקפדניים בחוות מרמת הגולן ועד ניר בנים שבדרום. <br>
הסיפור של מרינדו מתחיל בשנת 2003, בין אבני בזלת ונוף בראשית במושב כנף בדרום רמת הגולן. רועי תבור ואיתמר קנדליק חלמו והגשימו ביחד קונספט ייחודי של שיווק תוצרת חקלאית מהמגדל ישירות ללקוח.<br>
מרינדו החלה לשווק את תוצרתה ללא מתווכים ישירות ללקוחותיה באמצעות רשת של סניפים ובאמצעות משלוחים של הזמנות בשר טרי ללקוחות פרטיים עד הבית.<br>
לבשר המצוין מצטרפים גם מוצרי Private label של מרינדו- כולל יין, בירה, שמן זית, טחינה, תערובות תבלינים, ואיך לא – מרינדות. כל אלה מיוצרים ע"י יצרני בוטיק ישראליים מכל רחבי הארץ.   <br>
בשנת 2006 הוקמה הקצביה הראשונה של מרינדו ברחוב אוסישקין 56 ברמת השרון.<br>
שנה לאחר מכן, על שפת הכנרת, מול הכניסה לקיבוץ עין גב, הוקם מתחם מרינדו הכולל קצביית אם בוטיקית ומסעדת בשרים איכותית עם אווירה שאין לה מתחרים. לצד המסעדה נמצאת קצביה ומעדניה המציעה מוצרים נלווים - סירי פויקה, פלטות לצליית בשרים וכלל הציוד המשלים לפיקניק עבור המטיילים באזור היפה ביותר בארץ. <br>
בשנת 2010 הוקמו שתי קצביות נוספות – האחת ברחוב ויצמן 6 ברמת השרון והשניה בכיכר המדינה בתל אביב- ה' באייר 2 פינת ז'בוטינסקי 120.<br>
בשנת 2022 נרכשה מרינדו ע"י משפחת דה-לוי. אורי, רן ויובל – דור שלישי ורביעי למשפחת חקלאים מעמק יזרעאל, שמתגאה בהקפדה על איכות ומקצועיות ללא פשרות. אורי, רן ויובל הביאו איתם ניסיון רב בגידול מקומי ואיכותי של בקר וצאן. <br>
בשנת 2023 נפתחו ארבע קצביות בוטיק נוספות – במודיעין, בתל מונד, בגבעתיים וברמת אביב ג'.<br></p></div>
