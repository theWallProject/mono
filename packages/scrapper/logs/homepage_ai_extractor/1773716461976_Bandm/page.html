<script type="text/javascript" id="woodmart-theme-js-after">
/* <![CDATA[ */
(function () {
  const dict = [
    { contains: 'Add to wishlist',    replace: 'הוספה למועדפים' },
    { contains: 'Browse wishlist',    replace: 'צפייה במועדפים' },
    { contains: 'Add to compare',     replace: 'הוספה להשוואה' },
    { contains: 'Compare products',   replace: 'השוואת מוצרים' },
    { contains: ':Share',             replace: 'שיתוף' },
    { contains: 'Share',              replace: 'שיתוף' }
  ];

  function replaceTexts(root = document) {
    root.querySelectorAll('a, button, span, div, p, strong, em').forEach(el => {
      if (el.children.length) return;

      const text = (el.textContent || '').trim();
      if (!text) return;

      dict.forEach(({ contains, replace }) => {
        if (text === contains) {
          el.textContent = replace;
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', () => replaceTexts());

  const observer = new MutationObserver(() => replaceTexts());
  observer.observe(document.documentElement, { childList: true, subtree: true });

  setTimeout(replaceTexts, 1000);
})();
//# sourceURL=woodmart-theme-js-after
/* ]]> */
</script>
