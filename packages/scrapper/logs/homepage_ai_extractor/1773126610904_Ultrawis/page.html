nes’ rigging team</strong> on <strong data-start="744" data-end="786">two Terex CTL-620 luffing tower cranes</strong>, operating over a <strong data-start="805" data-end="823">6-month period</strong>.</p><h4 data-start="826" data-end="849"><strong data-start="831" data-end="849">Key Highlights</strong></h4><ul data-start="850" data-end="1228"><li data-start="850" data-end="970"><p data-start="852" data-end="970"><strong data-start="852" data-end="891">First UltraWis deployment in the UK</strong>, strengthening cooperation with leading contractors and crane manufacturers.</p></li><li data-start="971" data-end="1086"><p data-start="973" data-end="1086"><strong data-start="973" data-end="1019">Excellent operator and management feedback</strong>, confirming intuitive usability and clear productivity benefits.</p></li><li data-start="1087" data-end="1228"><p data-start="1089" data-end="1228"><strong data-start="1089" data-end="1138">&nbsp;3D modeling integration with drown deploy 3d model</strong>, enhancing UltraWis’s advanced collision avoidance and site visualization capabilities.</p></li></ul><p data-start="1230" data-end="1479">This successful collaboration demonstrates UltraWis’s ability to integrate seamlessly into major infrastructure projects, providing innovative digital tools that elevate crane safety, control, and efficiency across complex construction environments.</p></div></div></div></div></div><div class="swiper-slide swiper-slide-next" data-slide="2" role="group" aria-roledescription="slide" aria-label="2 / 5" data-swiper-slide-index="1" aria-hidden="true" inert="" style="width: 1280px; margin-right: 100px;"><div class="elementor-element elementor-element-8fc330d e-flex e-con-boxed e-con e-child" data-id="8fc330d" data-element_type="container"><div class="e-con-inner"><div class="elementor-element elementor-element-3da4286 e-con-full e-flex e-con e-child" data-id="3da4286" data-element_type="container" data-settings="{&quot;background_background&quot;:&
