        <script type="text/javascript">
            $(document).ready(function()
            {
                var slideTimeout;

                $('#fullpage').fullpage(
                {
                    anchors: ['', 'contact'],
                    menu: '#menu',
                    navigation: true,
                    navigationPosition: 'right',
                    navigationTooltips: ['', 'Contact'],
                    scrollingSpeed: 1000,
                    scrollOverflow: true,
                    afterRender: function()
                    {
                        slideTimeout = setInterval(function()
                        {
                            $.fn.fullpage.moveSlideRight();
                        }, 7500);
                    },
                    afterSlideLoad: function()
                    {
                        clearInterval(slideTimeout);

                        slideTimeout = setInterval(function()
                        {
                            $.fn.fullpage.moveSlideRight();
                        }, 7500);
                    },
                });

                var userLang = navigator.language || navigator.userLanguage;
                var simpleLang = userLang.split('-')[0];

                translate(loadLanguage(simpleLang));

                $('#lang-en, #lang-nl').click(function() {
                    translate(
                        loadLanguage(
                            $(this).data('lang')
                        )
                    );
                });

            });

            function loadLanguage(language)
            {
                $('.language').removeClass('active');

                var translationUrl = '/resources/lang/en.json';

                switch (language)
                {
                    default:
                    case 'en':
                        $('#lang-en').addClass('active');
                        translationUrl = '/resources/lang/en.json';
                        break;
                    case 'nl':
                        $('#lang-nl').addClass('active');
                        translationUrl = '/resources/lang/nl.json';
                        break;
                }

                var translation = (function () {
                    var translation = null;
                    $.ajax({
                        'async': false,
                        'global': false,
                        'url': translationUrl,
                        'dataType': "json",
                        'success': function (data) {
                            translation = data;
                        }
                    });
                    return translation;
                })();

                return translation;
            }

            function translate(translation)
            {
                $('.translation').each(function(i) {
                    $(this).html(translation[$(this).data('key')]);
                });
            }

            (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
            (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
            m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
            })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

            ga('create', 'UA-70854174-1', 'auto');
            ga('send', 'pageview');

        </script>
