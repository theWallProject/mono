<script type="text/javascript">

function CheckLoginValidity(formName) {
  var form = document.getElementById(formName);
  form.email.value = Trim(form.email.value);
  form.password.value = Trim(form.password.value);
  if(form.remember.checked){
  	createCookie("email",form.email.value,360);
  	createCookie("pass",escape(form.password.value),360);
  	createCookie("save",form.remember.checked,360);
  }
  else
  {
  	eraseCookie("email");
	eraseCookie("pass");
  	createCookie("save",'false',360);
  }
  form.submit();
  return true;
}
</script>
