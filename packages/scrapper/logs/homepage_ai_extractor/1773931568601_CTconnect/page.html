<!DOCTYPE html><html lang="he" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת CRM מתקדמת</title>
    <meta name="facebook-domain-verification" content="vppjaetifnblxjhxa1cdljbdfl2m0q">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .logo {
            max-width: 200px;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .contact-box {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .label {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
        }
        .phone-link {
            color: #3498db;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: color 0.2s;
        }
        .phone-link:hover {
            color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.png" alt="ctconnect" class="logo">
        
        <h1>מערכת CRM מתקדמת</h1>
        
        <div class="contact-box">
            <span class="label">לפרטים נוספים:</span>
            <a href="tel:025823602" class="phone-link">02-582-3602</a>
        </div>
    </div>

</body></html>
