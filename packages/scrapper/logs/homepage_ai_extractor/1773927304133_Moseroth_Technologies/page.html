/* הגדרות כלליות */
.my-button {
    background-color: #F8F8F8 !important; /* צבע רקע רגיל */
    color: #0080C4 !important; /* צבע טקסט רגיל */
    text-align: center !important; /* מיקום טקסט */
    padding: 20px !important; /* ריווח פנימי */
    border-radius: 8px !important; /* פינות מעוגלות */
    transition: all 0.3s ease !important; /* מעבר חלק */
}

/* מצב Hover */
.my-button:hover {
    background-color: #0080C4 !important; /* רקע במעבר */
    color: #F8F8F8 !important; /* צבע טקסט במעבר */
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px !important; /* צל עדין */
}

/* שינוי צבע האייקון */
.my-button svg {
    fill: #29235C !important; /* צבע אייקון רגיל - סגול */
    transition: fill 0.3s ease !important; /* מעבר חלק */
}

.my-button:hover svg {
    fill: #ffffff !important; /* צבע אייקון במעבר */
}

/* שינוי צבע טקסט בתוך קונטיינר */
.my-button .elementor-heading-title {
    transition: color 0.3s ease !important; /* אנימציה חלקה */
}

.my-button:hover .elementor-heading-title {
    color: #ffffff !important; /* צבע טקסט במעבר */
}
