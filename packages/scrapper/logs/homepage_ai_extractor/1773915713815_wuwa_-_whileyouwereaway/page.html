a:hover {

.header {

@keyframes blink 
{
0% {color:red;
border-bottom-color: red;
} 
20% {color:magenta;
border-bottom-color: magenta;
} 
40% {color:green;
border-bottom-color: green;
} 
60% {color:cyan;
border-bottom-color: cyan;
} 
80% {color:yellow;

}
