<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smellspace</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }

    header {
      background-color: #333;
      color: white;
      padding: 1em;
      display: flex;
      align-items: center;
    }

    .logo {
      height: 60px; /* 1.5× size */
    }

    main {
      text-align: center;
      padding: 2em;
    }

    img.main-img {
      max-width: 90%;
      height: auto;
      margin: 40px auto;
      display: block;
    }

    .lab-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #0077cc;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .lab-link:hover {
      background-color: #005fa3;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1em;
    }
  </style>
</head>
<body>

  <header>
    <img src="brand.png" alt="Logo" class="logo">
  </header>

  <main>
    <img src="smellspaceImage.png" alt="smellit" class="main-img">
    <a href="https://www.weizmann.ac.il/brain-sciences/worg/" target="_blank" class="lab-link">
      WORG - Olfaction Research Lab
    </a>
  </main>

  <footer>
    <p>© 2025 Smellspace</p>
  </footer>




</body></html>
