<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEC Filings for Ayala Pharmaceuticals, Inc.</title>
    <style>
        :root {
            --primary: #1a73e8;
            --light-gray: #f8f9fa;
            --gray: #e0e0e0;
            --dark: #202124;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #ffffff;
            color: #333;
            max-width: 1200px;
            margin-inline: auto;
        }

        .logo {
            font-size: 2.2em;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 40px;
            color: var(--dark);
        }
        .entries {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .entry {
            background: var(--light-gray);
            border: 1px solid var(--gray);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .entry:hover {
            transform: translateY(-2px);
        }

        .entry h3 {
            margin-top: 0;
            font-size: 1.1em;
        }

        .entry p {
            margin: 6px 0;
        }

        .entry a {
            display: inline-block;
            margin-top: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .entry a:hover {
            text-decoration: underline;
        }

        .pagination {
            margin-top: 30px;
            text-align: center;
        }

        .pagination a {
            margin: 0 4px;
            padding: 8px 12px;
            border-radius: 5px;
            background-color: #f0f0f0;
            color: #333;
            text-decoration: none;
            border: 1px solid #ddd;
            transition: background 0.2s;
        }

        .pagination a:hover {
            background-color: var(--primary);
            color: white;
        }

        .pagination .current {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .entry {
                padding: 15px;
            }
        }
        .logo img{
            min-width: 180px;
            height: auto;
        }

        .header{
            display: flex;
            align-items: center;

        }

        .header .logo{
            width: 30%;
            max-width: 300px;;
            margin-right: 20px;
        }

        .header .logo img{
            width: 100%;
        }

        .header h1{
            margin: 0;
            font-size: 26px;
        }

        .header *{
            margin: 0;
        }

        .banner{
            background-size: contain;   
            display: flex;
            align-items: flex-end;
            background-repeat: no-repeat;
        }

        .banner:after{
            padding-bottom: 56.5%;
            content: '';
            display: block;
        }

        .banner .container{
            padding: 2%;
            margin: 5%;
            background: rgba(0,0,0,0.25);
        }


        .banner{
            color: white;
        }

        .banner a,
        .banner h1{
            color: #f1dd5b;
            margin: 0;
        }

        .menu-list{
            position: absolute;
            right: 0;
            width: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            justify-content: flex-end;
            padding: 30px;
        }

        .menu-list > li{
            margin: 0 20px;
        }


        .menu-list > li a{
            color: white;
            text-decoration: unset;
            font-weight: bold;
            text-transform: uppercase;
        }

        .menu-list > li a:hover{
            color: #f1dd5b;
        }

        .menu{
            position: relative;
        }

    </style>
</head>
<body>

    <div class="menu">

        <ul class="menu-list">
            <li><a href="https://ayalapharma.com/">Home</a></li>
            <li><a href="https://ayalapharma.com/sec.php">SEC</a></li>
            <li><a href="mailto:sarit.s@ayalapharma.com">Contact</a></li>
        </ul>

    </div>

    <div class="banner" style="background-image: url('/images/page%206.png');">
        <div class="container">
            <h1>News</h1>
            <p>AL102 and AL101 were acquired in Q1 2024 by Immunome, Inc</p>
            <p> For BST-236 or other matters please contact Sarit Steinberg at:</p>
            <a href="mailto:sarit.s@ayalapharma.com">sarit.s@ayalapharma.com</a>
        </div>
    </div>



</body></html>
