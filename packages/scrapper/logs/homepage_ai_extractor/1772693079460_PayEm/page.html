" style="margin-bottom:2rem;margin-top:0.5rem">The management has much more transparency now and closing the books is much more efficient.</p><div class="css-1s5ypiu e11zkjv70"><img alt="Image" loading="lazy" width="640" height="640" decoding="async" data-nimg="1" class="css-1c3sxcn e11zkjv72" style="color:transparent;max-width:100%;height:auto" srcset="/_next/image?url=https%3A%2F%2Fresources.payem.co%2Fwp-content%2Fuploads%2F2024%2F09%2Fyana-fridman.webp&amp;w=640&amp;q=75 1x, /_next/image?url=https%3A%2F%2Fresources.payem.co%2Fwp-content%2Fuploads%2F2024%2F09%2Fyana-fridman.webp&amp;w=1920&amp;q=75 2x" src="/_next/image?url=https%3A%2F%2Fresources.payem.co%2Fwp-content%2Fuploads%2F2024%2F09%2Fyana-fridman.webp&amp;w=1920&amp;q=75"><p class="css-1x8mxdd eands0t1"><strong>Yana<!-- --> <!-- -->Fridman</strong><br>VP of Finance, Vi Labs</p></div></div></div></div></div></div></div><!--/$--><!--/$--><!--$--><!--$--><div class="css-1ttc720 e10d2w3h0"><div class="css-4i5z5l eq1u3y0"><h2 class="css-dn1eg2 eqxyw730">PayEm is your extra teammate handling receipts, approvals, and invoices automatically</h2><div class="css-15k7vsu ede80eh0"><div class="css-dkycw6 ede80eh2"><img alt="Image" loading="lazy" width="45" height="46" decoding="async" data-nimg="1" class="css-15ov87i ede80eh1" style="color:transparent;max-width:100%;height:auto" src="https://resources.payem.co/wp-content/uploads/2024/09/effortless-customization.svg"><h3 class="css-18rrn5m eqxyw730">Effortless Customization</h3><div class="css-1xs915v ede80eh3"><p class="css-ylrk6z eands0t1">Tailor your employee request forms to your exact specifications, without the need for extensive IT support. User-friendly and versatile, our forms adapt to your unique needs from custom fields to company protocols.</p></div></div><div class="css-l2gemy ede80eh2"><img alt="Image" loading="lazy" width="46" height="46" decoding="async" data-nimg="1" class="css-3phro8 ede80eh1" style="color:transparent;max-width:100%;height:auto" src
