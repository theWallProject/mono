<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><head>
	<title></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="mobile-web-app-capable" content="yes">
	<style>
		html, div
		{
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
		}
		body
		{
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: auto;
		}
		.table-container
		{
			/* Optional: Ensures the container takes up the full width */
			width: 100%; /* Centers the container if it's narrower than the screen */
			margin-left: auto;
			margin-right: auto; /* Centers the text/child elements inside the container */
			text-align: center;
			vertical-align: top;
		}
		.mainTable
		{
			/* Centers the table itself within its container */
			margin-left: auto;
			margin-right: auto; /* Ensures the table is a block element to accept margins */
			display: block;
		}
	</style>

	<script src="jquery-3.7.1.min.js" type="text/javascript"></script></head></html>
