&lt;pre class=&quot;mono&quot; style=&quot;margin:0;white-space:pre-wrap;background:var(--bg-alt);border-radius:10px;padding:14px;overflow-x:auto;font-size:14px;line-height:1.5&quot;&gt;// SPDX-License-Identifier: MIT
pragma solidity ^0.8.21;

contract IADomainRegistry {
  mapping(string =&amp;gt; address) public domains;
  event DomainMinted(string name, address owner);

  function mint(string memory name) public payable {
    require(domains[name] == address(0), &quot;Already taken&quot;);
    require(msg.value &amp;gt;= 0.01 ether, &quot;Insufficient payment&quot;);
    domains[name] = msg.sender;
    emit DomainMinted(name, msg.sender);
  }
}

  &lt;script&gt;
    // --- Mobile theme toggle (simple)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () =&gt; {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- Menu toggle on small screens
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=&gt;{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- Sample .ai wall
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d =&gt; `&lt;a class=&quot;tag&quot; role=&quot;listitem&quot; href=&quot;https://${d}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;${d}&lt;/a&gt;`).join('');
    })();

    // --- TLD checks: DoH (Google first, Cloudflare fallback) + favicon probe
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;dot-sm ${cls}&quot;&gt;&lt;/span&gt;&lt;strong&gt;${label}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;muted&quot;&gt;${note}&lt;/div&gt;&lt;/div&gt;`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&amp;type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j &amp;&amp; j.Status===0 &amp;&amp; Array.isArray(j.Answer) &amp;&amp; j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&amp;type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j &amp;&amp; j.Status===0 &amp;&amp; Array.isArray(j.Answer) &amp;&amp; j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=&gt;{ const img = new Image();
        const t = Date.now(); img.onload = ()=&gt;res(true); img.onerror=()=&gt;res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = &quot;Checking…&quot;;
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (proposed)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'Proposed • Community TLD Application (ASP ID: IAXL2597)'));

      // Generate placeholders for other TLDs
      const tldsToSearch = TLDs.filter(t =&gt; t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Checking…'));
      }

      // give layout a breath
      await new Promise(r=&gt;setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // skip the .ia row
      await Promise.all(cards.map(async (card, idx)=&gt;{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'Has DNS' : 'Unreachable (no DNS record found)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = &quot;Check&quot;;
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () =&gt; handleDomainSearch(null));
    }

    // --- Set current year in footer
    document.getElementById('year').textContent = new Date().getFullYear();
  &lt;/script&gt;

pragma solidity ^0.8.21;

contract IADomainRegistry {
  mapping(string =&gt; address) public domains;
  event DomainMinted(string name, address owner);

  <script>
    // --- Mobile theme toggle (simple)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- Menu toggle on small screens
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- Sample .ai wall
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- TLD checks: DoH (Google first, Cloudflare fallback) + favicon probe
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "Checking…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (proposed)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'Proposed • Community TLD Application (ASP ID: IAXL2597)'));

      // Generate placeholders for other TLDs
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Checking…'));
      }

      // give layout a breath
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // skip the .ia row
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'Has DNS' : 'Unreachable (no DNS record found)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "Check";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- Set current year in footer
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script>
    // --- Cambiar tema en móvil (simple)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- Alternar menú en pantallas pequeñas
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- Muro de dominios .ai (ejemplo)
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- Comprobaciones TLD: DoH (Google primero, Cloudflare alternativa) + prueba de favicon
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/, '').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "Comprobando…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (propuesto)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'Propuesto • Solicitud de TLD Comunitario (ASP ID: IAXL2597)'));

      // Generar placeholders para otros TLD
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Comprobando…'));
      }

      // respirar layout
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // saltar la fila .ia
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'Tiene DNS' : 'Inalcanzable (no se encontró registro DNS)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "Comprobar";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- Establecer año actual en el pie
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

<pre class="mono" style="margin:0;white-space:pre-wrap;background:var(--bg-alt);border-radius:10px;padding:14px;overflow-x:auto;font-size:14px;line-height:1.5">// SPDX-License-Identifier: MIT
pragma solidity ^0.8.21;

contract IADomainRegistry {
  mapping(string =&gt; address) public domains;
  event DomainMinted(string name, address owner);

  function mint(string memory name) public payable {
    require(domains[name] == address(0), "Already taken");
    require(msg.value &gt;= 0.01 ether, "Insufficient payment");
    domains[name] = msg.sender;
    emit DomainMinted(name, msg.sender);
  }
}

  <script>
    // --- Basculer le thème (mobile, simple)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- Ouvrir/fermer le menu sur petits écrans
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- Mur .ai (exemple)
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- Vérifications TLD : DoH (Google d’abord, Cloudflare en repli) + test favicon
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/, '').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "Vérification…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (proposé)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'Proposé • Demande de TLD communautaire (ID ASP : IAXL2597)'));

      // Générer des placeholders pour les autres TLD
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Vérification…'));
      }

      // respiration layout
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // ignorer la ligne .ia
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'DNS présent' : 'Injoignable (aucun enregistrement DNS trouvé)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "Vérifier";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- Année dynamique dans le pied de page
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

pragma solidity ^0.8.21;

contract IADomainRegistry {
  mapping(string =&gt; address) public domains;
  event DomainMinted(string name, address owner);

  function mint(string memory name) public payable {
    require(domains[name] == address(0), "Already taken");

  <script>
    // --- Alternar tema no mobile (simples)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- Alternar menu em telas pequenas
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- Parede de .ai (exemplo)
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- Verificações de TLD: DoH (Google primeiro, Cloudflare como fallback) + teste de favicon
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/, '').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "Verificando…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (proposto)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'Proposto • Candidatura de TLD Comunitário (ID ASP: IAXL2597)'));

      // Gerar placeholders para outros TLDs
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Verificando…'));
      }

      // dar fôlego ao layout
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // pular a linha .ia
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'Tem DNS' : 'Inalcançável (nenhum registro DNS encontrado)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "Verificar";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- Definir ano atual no rodapé
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

pragma solidity ^0.8.21;

contract IADomainRegistry {

  <script>
    // --- Cambia tema su mobile (semplice)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- Alterna menu su schermi piccoli
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- Bacheca di domini .ai (esempio)
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- Verifiche TLD: DoH (Google prima, Cloudflare fallback) + probe favicon
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/, '').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "Verifica in corso…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (proposto)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'Proposto • Domanda TLD Comunitario (ID ASP: IAXL2597)'));

      // Genera placeholder per altri TLD
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Verifica in corso…'));
      }

      // respiro layout
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // salta la riga .ia
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'Ha DNS' : 'Non raggiungibile (nessun record DNS trovato)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "Verifica";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- Imposta l’anno corrente nel piè di pagina
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script>
    // --- Comutare temă pe mobil (simplu)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- Alternare meniu pe ecrane mici
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- Perete .ai (exemplu)
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- Verificări TLD: DoH (Google mai întâi, Cloudflare fallback) + probă favicon
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/, '').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "Se verifică…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (propus)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'Propus • Cerere TLD Comunitar (ID ASP: IAXL2597)'));

      // Generează rânduri pentru celelalte TLD-uri
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Se verifică…'));
      }

      // mic respiro pentru layout
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // sar peste rândul .ia
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'Are DNS' : 'De neaccesat (nu a fost găsită nicio înregistrare DNS)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "Verifică";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- Setează anul curent în subsol
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script>
    // --- Commutatio thematis mobilis (simplex)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- Menu commutare in parvis velis
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- Murus .ai (exemplum)
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- Reprehensiones TLD: DoH (Google primum, Cloudflare subsidium) + probatio favicon
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "Reprehenditur…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (propositum)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'Propositum • Petitio TLD communitatis (ID ASP: IAXL2597)'));

      // Genera rimas pro aliis TLD
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Reprehenditur…'));
      }

      // anhelitus parvus pro compagine
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // omitte versum .ia
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'DNS adest' : 'Inaccessibile (nullus index DNS inventus)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "Reprehende";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- Annus currens in pede paginae
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

  <script>
    // --- Mobiler Theme‑Schalter (einfach)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- Menüschalter auf kleinen Bildschirmen
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- Beispiel‑Wall für .ai
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- TLD‑Prüfung: DoH (zuerst Google, Fallback Cloudflare) + Favicon‑Probe
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(\`https://dns.google/resolve?name=\${domain}&type=A\`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(\`https://cloudflare-dns.com/dns-query?name=\${domain}&type=A\`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = \`https://\${domain}/favicon.ico?__t=\${t}\`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "Wird geprüft…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (vorgeschlagen)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(\`\${name}.ia\`, 'warn', 'Vorgeschlagen • Community‑TLD‑Antrag (ASP ID: IAXL2597)'));

      // Platzhalter für andere TLDs
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = \`\${name}.\${tld}\`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Wird geprüft…'));
      }

      // Layout atmen lassen
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // .ia‑Zeile überspringen
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = \`\${name}.\${tld}\`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'DNS vorhanden' : 'Nicht erreichbar (kein DNS‑Eintrag gefunden)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "Prüfen";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- Aktuelles Jahr im Footer setzen
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

pragma solidity ^0.8.21;

contract IADomainRegistry {
  mapping(string =&gt; address) public domains;
  event DomainMinted(string name, address owner);

  function mint(string memory name) public payable {
    require(domains[name] == address(0), "Already taken");
    require(msg.value &gt;= 0.01 ether, "Insufficient payment");

    // --- TLD‑controles: DoH (eerst Google, fallback Cloudflare) + favicon‑probe
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "Bezig met controleren…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (voorgesteld)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'Voorgesteld • Aanvraag Gemeenschaps‑TLD (ASP ID: IAXL2597)'));

      // Plaatshouders voor andere TLD’s
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'Bezig met controleren…'));
      }

      // layout laten ademen
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // sla de .ia‑rij over
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'DNS aanwezig' : 'Onbereikbaar (geen DNS‑record gevonden)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "Controleren";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- Huidig jaar in de footer zetten
    document.getElementById('year').textContent = new Date().getFullYear();

    // --- モバイル用テーマ切替（簡易）
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- 小画面でのメニュー切替
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- .ai ドメインのサンプルウォール
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- TLD 確認：DoH（まず Google、次に Cloudflare）+ favicon の有無
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "確認中…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA（提案中）
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', '提案中 • コミュニティ TLD 申請（ASP ID: IAXL2597）'));

      // 他 TLD のプレースホルダー
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', '確認中…'));
      }

      // レイアウト安定のため小休止
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // .ia 行を除外
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'DNS あり' : '到達不可（DNS レコードが見つかりません）';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "確認";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- フッターの年を現在年に設定
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

contract IADomainRegistry {

  <script>
    // --- 모바일 테마 토글(간단)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;

        d.dataset.theme = dark ? 'light' : 'dark';

    // --- 작은 화면에서 메뉴 토글
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;

        if(!links) return;

      });
    })();

    // --- .ai 쇼케이스 벽(샘플)
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- TLD 확인: DoH(Google 우선, Cloudflare 보조) + 파비콘 검사
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "확인 중…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (제안)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', '제안됨 • 커뮤니티 TLD 신청(ASP ID: IAXL2597)'));

      // 다른 TLD용 플레이스홀더
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', '확인 중…'));
      }

      // 레이아웃 안정 대기
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // .ia 행 제외
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'DNS 있음' : '접속 불가(DNS 레코드 없음)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "확인";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- 푸터의 연도 설정
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,Helvetica,sans-serif}
    a{color:var(--brand);text-decoration:none}
    a:hover{opacity:.9}
    .container{max-width:1120px;margin:0 auto;padding:0 20px}

    /* ส่วนหัว */
    header{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--panel) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in oklab,var(--muted) 10%,transparent)}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
    .brand{font-weight:900;font-size:20px;letter-spacing:.2px}
    .dot{background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .links{display:flex;gap:22px}
    .links a{color:var(--muted);font-weight:600}
    .links a.active,.links a:hover{color:var(--brand)}
    .icon-btn{appearance:none;border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer}
    .icon-btn:hover{box-shadow:var(--ring)}
    .only-mobile{display:none}
    @media(max-width:800px){.links{display:none}.only-mobile{display:block}}

    /* แบนเนอร์แจ้งสถานะ */
    .alert-banner{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;padding:16px 0;text-align:center;font-weight:600}
    .alert-banner a{color:#fff;text-decoration:underline}

    /* ฮีโร่ */
    .hero{padding:72px 0 28px}
    .title{font-size:clamp(28px,6vw,56px);line-height:1.05;font-weight:900;margin:0}
    .title i{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .subtitle{max-width:820px;margin:14px 0 0;color:var(--muted);font-size:clamp(16px,2.6vw,20px)}
    .cta-row{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:12px 18px;font-weight:700;border:1px solid color-mix(in oklab,var(--brand) 22%,transparent);box-shadow:var(--shadow)}
    .btn.primary{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;border:0}
    .btn.ghost{background:transparent;color:var(--brand)}

    /* แผง/ส่วนต่าง ๆ */
    .panel{background:var(--panel);border:1px solid color-mix(in oklab,var(--muted) 12%,transparent);border-radius:var(--radius);box-shadow:var(--shadow)}
    .section{padding:56px 0}
    .section h2{font-size:clamp(22px,4.5vw,32px);margin:0 0 6px}
    .section h3{font-size:clamp(18px,3.5vw,24px);margin:32px 0 12px;color:var(--brand)}
    .section p.lead{margin:0 0 22px;color:var(--muted)}
    .section ul{line-height:1.8;color:var(--muted)}
    .section ul li{margin-bottom:8px}

    /* กล่องข้อมูล */
    .info-box{background:color-mix(in oklab,var(--brand) 5%,transparent);border-left:4px solid var(--brand);padding:20px;border-radius:12px;margin:24px 0}
    .info-box h4{margin:0 0 8px;color:var(--brand)}
    .info-box p{margin:6px 0;line-height:1.6}

    /* ค้นหาโดเมน */
    .search-wrap{padding:22px}
    form.search{display:flex;gap:10px;flex-wrap:wrap}
    .input{flex:1;min-width:220px;padding:14px 16px;border-radius:999px;border:2px solid color-mix(in oklab,var(--muted) 20%,transparent);outline:none;background:var(--bg);color:var(--text)}
    .input:focus{box-shadow:var(--ring);border-color:var(--brand)}
    .search button{padding:14px 18px;border-radius:999px;border:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;font-weight:800}
    .hint{font-size:13px;color:var(--muted);margin-top:8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
    .card{padding:14px 14px;border-radius:14px;border:1px solid color-mix(in oklab,var(--muted) 16%,transparent);background:color-mix(in oklab,var(--panel) 92%,transparent)}
    .row{display:flex;align-items:center;gap:10px}
    .dot-sm{width:10px;height:10px;border-radius:50%}
    .ok{background:var(--ok)} .err{background:var(--err)} .warn{background:var(--warn)}
    .muted{color:var(--muted)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .spin{width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin 0.9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ผนังโชว์เคส */
    .wall{display:flex;flex-wrap:wrap;gap:10px;max-height:220px;overflow:auto;padding:14px;background:var(--bg-alt);border-radius:var(--radius);border:1px solid color-mix(in oklab,var(--muted) 12%,transparent)}
    .tag{padding:8px 12px;border-radius:999px;background:color-mix(in oklab,var(--panel) 90%,transparent);border:1px solid color-mix(in oklab,var(--muted) 14%,transparent);font-weight:700}

    /* คอลัมน์แบบแบ่งครึ่ง */
    .split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:920px){.split{grid-template-columns:1fr}}

    /* ตาราง */
    .table-wrap{overflow-x:auto;margin:20px 0}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px;text-align:left;border-bottom:1px solid color-mix(in oklab,var(--muted) 12%,transparent)}
    th{font-weight:800}

    /* FAQ */
    .faq-item{margin-bottom:24px;padding:20px;background:color-mix(in oklab,var(--panel) 96%,transparent);border-radius:12px;border:1px solid color-mix(in oklab,var(--muted) 10%,transparent)}
    .faq-item h4{margin:0 0 8px;color:var(--brand);font-size:18px}
    .faq-item p{margin:0;color:var(--muted);line-height:1.6}

    /* ท้ายเว็บไซต์ */
    footer{padding:44px 0;border-top:1px solid color-mix(in oklab,var(--muted) 12%,transparent);color:var(--muted)}
    .footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    @media(max-width:920px){.footer-grid{grid-template-columns:1fr}}
    .disclaimer{font-size:14px;line-height:1.6;margin-top:20px;padding:16px;background:color-mix(in oklab,var(--warn) 5%,transparent);border-left:4px solid var(--warn);border-radius:8px}
  </style>

pragma solidity ^0.8.21;

contract IADomainRegistry {
  mapping(string =&gt; address) public domains;
  event DomainMinted(string name, address owner);

  function mint(string memory name) public payable {
    require(domains[name] == address(0), "Already taken");
    require(msg.value &gt;= 0.01 ether, "Insufficient payment");

    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "กำลังตรวจสอบ…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (ข้อเสนอ)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'อยู่ระหว่างเสนอ • สมัครเป็น TLD ของชุมชน (ASP ID: IAXL2597)'));

      // สร้างรายการสำหรับ TLD อื่น
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'กำลังตรวจสอบ…'));
      }

      // เว้นระยะให้เลย์เอาต์
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // ข้ามแถว .ia
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'มี DNS' : 'ไม่สามารถเข้าถึง (ไม่พบระเบียน DNS)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "ตรวจสอบ";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    document.getElementById('year').textContent = new Date().getFullYear();

    // --- 移动端主题切换（简版）
    (function(){

        const d = document.documentElement;
