    // --- 小屏菜单切换
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- .ai 展示墙（样例）
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- TLD 检查：DoH（先 Google，后 Cloudflare）+ favicon 探测
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "正在检查…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA（拟议）
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', '拟议中 • 社区 TLD 申请（ASP ID: IAXL2597）'));

      // 其他 TLD 占位
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', '正在检查…'));
      }

      // 稍作等待以稳定布局
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // 跳过 .ia 行
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? '已配置 DNS' : '不可达（未找到 DNS 记录）';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "检查";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- 设置页脚年份
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

contract IADomainRegistry {

  <script>
    // --- 行動版主題切換（簡式）
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- 小螢幕選單切換
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- .ai 展示牆（示例）
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- TLD 檢查：DoH（Google 優先、Cloudflare 備援）＋ favicon 探測
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/,'').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "正在檢查…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA（提議中）
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', '提議中 • 社群 TLD 申請（ASP ID: IAXL2597）'));

      // 其他 TLD 佔位
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', '正在檢查…'));
      }

      // 讓版面喘口氣
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // 跳過 .ia 那列
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? '已有 DNS' : '無法連線（找不到 DNS 紀錄）';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "檢查";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- 設定頁尾年份
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){

      if(!resultsContainer || !checkBtn || !nameInput) return;

pragma solidity ^0.8.21;

contract IADomainRegistry {
  mapping(string =&gt; address) public domains;

  <script>
    // --- मोबाइल थीम टॉगल (सरल)
    (function(){
      const btn = document.getElementById('modeBtn');
      if(!btn) return;
      const toggle = () => {
        const d = document.documentElement;
        const dark = d.dataset.theme === 'dark';
        d.dataset.theme = dark ? 'light' : 'dark';
        btn.textContent = dark ? '☼' : '☽';
      };
      btn.addEventListener('click', toggle);
    })();

    // --- छोटे स्क्रीन पर मेन्यू टॉगल
    (function(){
      const menuBtn = document.querySelector('.icon-btn.only-mobile');
      if(!menuBtn) return;
      menuBtn.addEventListener('click', ()=>{
        const links = document.querySelector('.links');
        if(!links) return;
        links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
      });
    })();

    // --- नमूना .ai वॉल
    (function(){
      const wall = document.getElementById('aiWall');
      if (!wall) return;
      const domains = [
        'perplexity.ai','character.ai','mistral.ai','stability.ai','cohere.ai','h2o.ai','lightning.ai','fast.ai','jasper.ai','copy.ai','leonardo.ai','figure.ai','luma.ai','hume.ai','recraft.ai','x.ai','nomic.ai','otter.ai','modal.ai','novel.ai','landing.ai','snorkel.ai','scale.ai','wandb.ai','coqui.ai'
      ];
      wall.innerHTML = domains.map(d => `<a class="tag" role="listitem" href="https://${d}" target="_blank" rel="noopener">${d}</a>`).join('');
    })();

    // --- TLD जाँच: DoH (पहले Google, वैकल्पिक Cloudflare) + favicon प्रोब
    const TLDs = ['ia','com','net','org','io','co','ai','xyz'];
    const domainForm = document.getElementById('domainForm');
    const resultsContainer = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const nameInput = document.getElementById('name');
    const ctaSpinner = document.getElementById('cta-spinner');

    function rowHTML(label, status, note){
      const cls = status==='ok'?'ok':status==='warn'?'warn':'err';
      return `<div class="card"><div class="row"><span class="dot-sm ${cls}"></span><strong>${label}</strong></div><div class="muted">${note}</div></div>`;
    }

    async function dohGoogle(domain){
      try{
        const r = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    async function dohCloudflare(domain){
      try{
        const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=A`, {headers:{'accept':'application/dns-json'}});
        if(!r.ok) return null;
        const j = await r.json();
        return (j && j.Status===0 && Array.isArray(j.Answer) && j.Answer.length) ? j.Answer : null;
      }catch(e){ return null; }
    }

    function faviconProbe(domain){
      return new Promise(res=>{ const img = new Image();
        const t = Date.now(); img.onload = ()=>res(true); img.onerror=()=>res(false);
        img.src = `https://${domain}/favicon.ico?__t=${t}`;
      });
    }

    async function hasDNS(domain){
      const a = await dohGoogle(domain);
      if(a) return true;
      const b = await dohCloudflare(domain);
      if(b) return true;
      const fav = await faviconProbe(domain);
      return !!fav;
    }

    async function handleDomainSearch(e){
      if(e) e.preventDefault();
      if(!resultsContainer || !checkBtn || !nameInput) return;

      const name = (nameInput.value || '').trim().toLowerCase()
        .replace(/[^a-z0-9-]/g,'').replace(/^-/, '').replace(/-$/,'') || 'robotica';

      resultsContainer.innerHTML = '';
      checkBtn.disabled = true; checkBtn.innerHTML = "जाँच हो रही है…";
      if (ctaSpinner) ctaSpinner.style.display = 'inline-block';

      // .IA (प्रस्तावित)
      resultsContainer.insertAdjacentHTML('beforeend', rowHTML(`${name}.ia`, 'warn', 'प्रस्तावित • सामुदायिक TLD आवेदन (ASP ID: IAXL2597)'));

      // बाकी TLDs के लिए प्लेसहोल्डर
      const tldsToSearch = TLDs.filter(t => t !== 'ia');
      for (const tld of tldsToSearch) {
        const label = `${name}.${tld}`;
        resultsContainer.insertAdjacentHTML('beforeend', rowHTML(label, 'warn', 'जाँच हो रही है…'));
      }

      // लेआउट को एक सांस दें
      await new Promise(r=>setTimeout(r, 80));

      const cards = [...resultsContainer.querySelectorAll('.card')].slice(1); // .ia पंक्ति छोड़ें
      await Promise.all(cards.map(async (card, idx)=>{
        const tld = tldsToSearch[idx];
        const domain = `${name}.${tld}`;
        const ok = await hasDNS(domain);
        const dot = card.querySelector('.dot-sm');
        const text = card.querySelector('.muted');
        if (dot) dot.className = 'dot-sm ' + (ok ? 'ok' : 'err');
        if (text) text.textContent = ok ? 'DNS मिला' : 'अप्राप्य (DNS रिकॉर्ड नहीं मिला)';
      }));

      checkBtn.disabled = false; checkBtn.innerHTML = "जाँचें";
      if (ctaSpinner) ctaSpinner.style.display = 'none';
    }

    if (domainForm) {
      domainForm.addEventListener('submit', handleDomainSearch);
      window.addEventListener('load', () => handleDomainSearch(null));
    }

    // --- फूटर में वर्तमान वर्ष सेट करें
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script>
  (function(){
    const ALL = ['en','es','fr','pt','it','ro','la','ca','gl','oc','de','nl','ja','ko','th','zh','zh-TW','fil','hi'];
    const DEFAULT = 'en';
    const frame = document.getElementById('content');
    const pills = Array.from(document.querySelectorAll('.pill'));
    const more = document.getElementById('moreSelect');
    const STORE = 'iaxyz_lang';

    function mapLocale(loc){ if(!loc) return null; const s=String(loc).toLowerCase(); if(s.startsWith('zh-tw')||s.includes('hanst')||s.includes('hk')) return 'zh-TW'; if(s.startsWith('zh')) return 'zh'; const b=s.split('-')[0]; return ALL.includes(b)?b:null; }

    function getParamLang(){ const url=new URL(location.href); const p=url.searchParams.get('lang'); return mapLocale(p); }
    function setParamLang(l){ const url=new URL(location.href); url.searchParams.set('lang',l); history.replaceState(null,'',url.toString()); }

    function setLang(l){
      if(!ALL.includes(l)) l=DEFAULT;
      const tpl=document.getElementById('tpl-'+l);
      if(tpl) frame.srcdoc = tpl.innerHTML;
      document.documentElement.lang=l;
      localStorage.setItem(STORE,l);
      setParamLang(l);
      pills.forEach(p => p.setAttribute('aria-current', String(p.dataset.lang===l)));
      if(more) more.value = '';
    }

    pills.forEach(p => p.addEventListener('click', () => setLang(p.dataset.lang)));
    if(more) more.addEventListener('change', () => setLang(more.value));

    (function init(){
      const param=getParamLang();
      if(param){ setLang(param); return; }
      const saved=localStorage.getItem(STORE);
      if(saved && ALL.includes(saved)){ setLang(saved); return; }
      const prefs=(navigator.languages||[navigator.language||'']).map(x=>String(x||''));
      for(const p of prefs){ const m=mapLocale(p); if(m){ setLang(m); return; } }
      setLang(DEFAULT);
    })();
  })();
  </script>
