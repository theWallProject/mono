<script id="vertexShader" type="x-shader/x-vertex">

uniform float time;
varying vec3 vPosition;
void main() {
  vPosition = position;
  vPosition.x += sin( time + vPosition.z * 4.0 ) / 4.0;
  vPosition.y += cos( time + vPosition.z * 4.0 ) / 4.0;
  gl_Position = projectionMatrix * modelViewMatrix * vec4( vPosition, 1.0 );
}

</script>

  const fragmentShader = `
  #include <common>

  uniform vec3 iResolution;
  uniform float iTime;

 
  


float hash(vec2 p) { return fract(1e4 * sin(17.0 * p.x + p.y * 0.1) * (0.1 + abs(sin(p.y * 13.0 + p.x)))); }
float noise(vec2 x) {
    vec2 i = floor(x);
    vec2 f = fract(x);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
}

#define octaves 14
float fbm (in vec2 p) {

    float value = 0.0;
    float freq = 1.0;
    float amp = 0.5;    

    for (int i = 0; i < octaves; i++) {
        value += amp * (noise((p - vec2(1.0)) * freq));
        freq *= 1.8;
        amp *= 0.6;
    }
    return value;
}

float pattern(in vec2 p) {
    vec2 offset = vec2(-0.5);

    vec2 aPos = vec2(sin(iTime * 0.06), sin(iTime * 0.001)) * 5.;
    vec2 aScale = vec2(3.0);
    float a = fbm(p * aScale + aPos);

    vec2 bPos = vec2(sin(iTime * 0.01), sin(iTime * 0.01)) * 1.;
    vec2 bScale = vec2(0.6);
    float b = fbm((p + a) * bScale + bPos);

    vec2 cPos = vec2(-0.6, -0.5) + vec2(sin(-iTime * 0.001), sin(iTime * 0.01)) * 2.;
    vec2 cScale = vec2(2.6);
    float c = fbm((p + b) * cScale + cPos);
    return c;
}

vec3 palette(in float t) {
    vec3 a = vec3(0.564, 0.839, 0.913); //orange
    vec3 b = vec3(0.603, 0.713, 0.564);
    vec3 c = vec3(0.364, 0.913, 0.980);
    return a + b * sin(3.68318 * (c * t + a));
}

void mainImage (out vec4 fragColor, in vec2 fragCoord) {
    vec2 p = fragCoord.xy / iResolution.xy;
    p.x *= iResolution.x / iResolution.y;
    float value = pow(pattern(p), 1.8); // more "islands"
    vec3 color = palette(value);
    fragColor = vec4(color, 1.0);
}
  void main() {
    mainImage(gl_FragColor, gl_FragCoord.xy);
  }
  

`;
